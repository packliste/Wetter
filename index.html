<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wetter & Radar</title>
    <style>
        :root {
            --primary: #007aff; /* Modernes iOS-Blau */
            --bg-gray: #f2f2f7;
            --card-bg: #ffffff;
            --text: #1c1c1e;
            --text-muted: #8e8e93;
            --radius: 16px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gray); 
            color: var(--text);
            margin: 0; 
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: var(--radius); 
            box-shadow: 0 8px 24px rgba(0,0,0,0.05); 
        }
        
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 16px 0;
            letter-spacing: -0.5px;
        }

        /* Suchbox & Wrapper für das Custom-Dropdown */
        .search-box { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 16px; 
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            font-size: 16px; 
            background: #f2f2f7;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        
        .search-box input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
        }

        /* Custom Favoriten-Dropdown (iOS-Look) */
        .favorites-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .favorite-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f2f2f7;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        .favorite-item:last-child {
            border-bottom: none;
        }

        .favorite-item:active {
            background: #e5e5ea;
        }

        .delete-fav {
            color: #ff3b30;
            padding: 4px 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        /* Buttons im App-Style */
        button { 
            padding: 12px 16px; 
            font-size: 15px;
            font-weight: 600;
            cursor: pointer; 
            border: none; 
            border-radius: 12px; 
            background: var(--primary); 
            color: white; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 44px; 
            transition: opacity 0.2s, transform 0.1s;
        }
        
        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        button.btn-secondary {
            background: #e5e5ea;
            color: var(--text);
        }

        /* Controls Leiste */
        .controls { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 4px; 
            margin-bottom: 16px; 
            background: #f2f2f7;
            padding: 4px;
            border-radius: 12px;
        }
        
        .controls button {
            background: transparent;
            color: var(--text-muted);
            font-size: 12px; 
            padding: 8px 2px;
            min-height: 38px;
            border-radius: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls button.active {
            background: #fff;
            color: var(--text);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .btn-fullscreen {
            width: 100%;
            background: #3a3a3c;
            margin-bottom: 16px;
        }

        /* Radar-Wrapper Anpassung */
        #radar-wrapper { 
            position: relative; 
            width: 100%; 
            height: 60vh; 
            max-height: 450px;
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
        }
        
        #windy-iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        
        /* Smarter Vollbild-Modus */
        .fullscreen-mode { 
            position: fixed !important; 
            top: 0; 
            left: 0; 
            width: 100vw !important; 
            height: 100vh !important; 
            max-height: none !important;
            z-index: 9999; 
            border-radius: 0 !important; 
        }
        
        .btn-close { 
            position: fixed; 
            bottom: 24px; 
            right: 24px; 
            z-index: 100000; 
            width: 56px;
            height: 56px;
            padding: 0;
            background: #ff3b30; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            font-size: 28px;
            box-shadow: 0 4px 16px rgba(255,59,48,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        @media (max-width: 375px) {
            body { padding: 8px; }
            .container { padding: 12px; }
            h1 { font-size: 20px; }
            .controls button { font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1 id="app-title">Wetter & Radar: München Laim</h1>
    
    <div class="search-box">
        <div class="input-wrapper">
            <input type="text" id="city-input" placeholder="Ort suchen..." 
                   onkeydown="if(event.key === 'Enter') updateLocation()" 
                   onfocus="showDropdown()" 
                   onblur="hideDropdown()">
            
            <div id="favorites-dropdown" class="favorites-dropdown" style="display: none;"></div>
        </div>

        <button onclick="updateLocation()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="btn-secondary" onclick="saveFavorite()" aria-label="Favorit speichern">⭐</button>
    </div>

    <div class="controls">
        <button id="btn-radar" class="active" onclick="setLayer('radar')">Radar</button>
        <button id="btn-forecast" onclick="setLayer('forecast')">Prognose</button>
        <button id="btn-temp" onclick="setLayer('temp')">Temp</button>
        <button id="btn-wind" onclick="setLayer('wind')">Wind</button>
    </div>

    <button class="btn-fullscreen" onclick="toggleFullscreen()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        Vollbild-Ansicht
    </button>

    <div id="radar-wrapper">
        <iframe id="windy-iframe" src="https://embed.windy.com/embed.html?type=map&location=coordinates&zoom=11&overlay=radar&lat=48.1444&lon=11.5033"></iframe>
    </div>
</div>

<button class="btn-close" id="close-btn" style="display:none" onclick="toggleFullscreen()">×</button>

<script>
    // Zentrale App-Status-Variablen (Verhindert fehlerhafte URL-Ketten)
    let currentLat = "48.1444";
    let currentLon = "11.5033";
    let currentLayer = "radar";

    window.addEventListener('DOMContentLoaded', () => {
        loadFavorites();
        
        // Zuletzt ausgegebenen Ort aus dem LocalStorage laden
        const lastLocation = JSON.parse(localStorage.getItem('app_last_location'));
        if (lastLocation) {
            currentLat = lastLocation.lat;
            currentLon = lastLocation.lon;
            document.getElementById('city-input').value = lastLocation.input;
            document.getElementById('app-title').innerText = `Wetter & Radar: ${lastLocation.name}`;
            updateIframe();
        } else {
            updateIframe(); // Standard-Ansicht laden (München Laim)
        }
    });

    // Baut je nach ausgewähltem Modus die perfekte Windy-URL zusammen
    function updateIframe() {
        const iframe = document.getElementById('windy-iframe');
        
        // Schaltet bei 'forecast' (Prognose) auf das Regenradar ('rain') um
        const overlay = currentLayer === 'forecast' ? 'rain' : currentLayer;
        
        iframe.src = `https://embed.windy.com/embed.html?type=map&location=coordinates&zoom=11&overlay=${overlay}&lat=${currentLat}&lon=${currentLon}`;
    }

    function loadFavorites() {
        const dropdown = document.getElementById('favorites-dropdown');
        const favorites = JSON.parse(localStorage.getItem('app_favorites')) || [];
        
        if (favorites.length === 0) {
            dropdown.innerHTML = '<div style="padding: 12px 16px; color: var(--text-muted); font-size: 14px; text-align: center;">Keine Favoriten gespeichert</div>';
            return;
        }
        
        dropdown.innerHTML = '';
        favorites.forEach(city => {
            const item = document.createElement('div');
            item.className = 'favorite-item';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = city;
            textSpan.style.flex = '1';
            
            item.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('delete-fav')) return;
                document.getElementById('city-input').value = city;
                updateLocation();
                hideDropdown();
            });
            
            const deleteBtn = document.createElement('span');
            deleteBtn.className = 'delete-fav';
            deleteBtn.innerText = '✕';
            deleteBtn.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                removeFavorite(city);
            });
            
            item.appendChild(textSpan);
            item.appendChild(deleteBtn);
            dropdown.appendChild(item);
        });
    }

    function showDropdown() {
        loadFavorites();
        document.getElementById('favorites-dropdown').style.display = 'block';
    }

    function hideDropdown() {
        setTimeout(() => {
            document.getElementById('favorites-dropdown').style.display = 'none';
        }, 150);
    }

    function saveFavorite() {
        const city = document.getElementById('city-input').value.trim();
        if(!city) return;
        
        let favorites = JSON.parse(localStorage.getItem('app_favorites')) || [];
        
        if (!favorites.includes(city)) {
            favorites.push(city);
            localStorage.setItem('app_favorites', JSON.stringify(favorites));
            loadFavorites();
            alert(`"${city}" als Favorit gespeichert!`);
        } else {
            alert(`"${city}" ist bereits gespeichert.`);
        }
    }

    function removeFavorite(city) {
        let favorites = JSON.parse(localStorage.getItem('app_favorites')) || [];
        favorites = favorites.filter(item => item !== city);
        localStorage.setItem('app_favorites', JSON.stringify(favorites));
        loadFavorites();
    }

    function setLayer(layer) {
        currentLayer = layer;
        
        // UI-Klassen anpassen
        document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${layer}`).classList.add('active');
        
        // Iframe neu laden mit neuer Logik
        updateIframe();
    }

    function toggleFullscreen() {
        const wrapper = document.getElementById('radar-wrapper');
        const btn = document.getElementById('close-btn');
        const isFullscreen = wrapper.classList.toggle('fullscreen-mode');
        
        btn.style.display = isFullscreen ? 'flex' : 'none';
        document.body.style.overflow = isFullscreen ? 'hidden' : '';
    }

    async function updateLocation() {
        const cityInput = document.getElementById('city-input');
        const city = cityInput.value.trim();
        if(!city) return;

        const searchButton = document.querySelector('.search-box button');
        searchButton.style.opacity = '0.5';

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}&limit=1`);
            const data = await response.json();

            if (data && data.length > 0) {
                // Koordinaten global speichern
                currentLat = parseFloat(data[0].lat).toFixed(4);
                currentLon = parseFloat(data[0].lon).toFixed(4);
                const displayName = data[0].display_name.split(',')[0]; 

                document.getElementById('app-title').innerText = `Wetter & Radar: ${displayName}`;
                
                // Aktuelle Location im LocalStorage als letzten Ort sichern
                localStorage.setItem('app_last_location', JSON.stringify({
                    lat: currentLat,
                    lon: currentLon,
                    name: displayName,
                    input: city
                }));
                
                // Iframe aktualisieren
                updateIframe();
            } else {
                alert("Ort leider nicht gefunden.");
            }
        } catch (error) {
            console.error("Fehler bei der Ortssuche:", error);
        } finally {
            searchButton.style.opacity = '1';
        }
    }
</script>

</body>
</html>
